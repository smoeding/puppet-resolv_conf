# CI.yaml --- Check OpenVox module

name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

variables:
  # Use internal default Rakefile, to make sure we have a working version
  RAKE: bundle exec rake -f /opt/voxbox/Rakefile

jobs:
  checks:
    name: OpenVox ${{ matrix.openvox_version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        openvox_version: [8]

    container:
      image: ghcr.io/voxpupuli/voxbox:${{ matrix.openvox_version }}
      entrypoint: [""]
      volumes:
        - ${{ github.workspace }}:/repo
        - /etc/gitconfig:/etc/gitconfig

    steps:
      - name: Clone repository
        uses: actions/checkout@v6

      - name: Syntax
        script:
          - $RAKE syntax

      - name: Check
        script:
          - $RAKE check

      - name: Lint code
        script:
          - $RAKE lint

      - name: Lint YAML
        if: ${{ hashFiles('data') != '' }}
        script:
          - yamllint data/

      - name: Lint Metadata
        script:
          - $RAKE metadata_lint

      - name: Rubocop
        script:
          - $RAKE rubocop

      - name: Unit Tests
        script:
          - $RAKE spec
